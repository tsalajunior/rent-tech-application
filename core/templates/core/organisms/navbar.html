{% load static %}

<nav class="bg-renttech-dark text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3">
                <a href="{% url 'core:dashboard' %}">
                    <img class="h-10 rounded-md w-auto" src="{% static 'core/images/RentTech_Logo.jpg' %}"
                        alt="RentTech_Logo">
                </a>
            </div>
            <!-- Dans la navbar (desktop) -->
            <div class="hidden md:flex items-center space-x-6">
                <a href="{% url 'core:dashboard' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium transition">Tableau de bord</a>
                <a href="{% url 'core:liste_equipements' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium transition">Équipements</a>
                <a href="{% url 'core:liste_clients' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium transition">Clients</a>

                <a href="{% url 'core:liste_locations' %}" class="text-gray-300 hover:text-white text-sm font-medium transition">Locations</a>
                {% if request.user.is_superuser %}
                <a href="{% url 'core:liste_utilisateurs' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium transition">Utilisateurs</a>
                <a href="{% url 'core:liste_agences' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium transition">
                    Agences
                </a>
                <a href="{% url 'core:liste_categories' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium transition">Catégories</a>
                {% endif %}
            </div>

            <!-- À droite dans la navbar (Profil et Déconnexion) -->
            <div class="flex items-center space-x-4">
                <a href="{% url 'core:mon_profil' %}"
                    class="text-gray-300 hover:text-white text-sm font-medium flex items-center gap-2 bg-gray-800 px-3 py-1.5 rounded-md transition">
                    <span>{{ request.user.username }}</span>
                </a>
                <form action="{% url 'core:logout' %}" method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit"
                        class="text-red-400 hover:text-red-300 text-sm font-medium transition">Déconnexion</button>
                </form>
            </div>
        </div>
    </div>
</nav>
