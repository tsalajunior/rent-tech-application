<tr class="hover:bg-gray-50 transition border-b border-gray-100">
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-renttech-dark">
        {{ equipement.reference }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700" title="{{ equipement.nom }}">
        {{ equipement.nom|truncatechars:30 }}
    </td>
    <!-- Nouvelle colonne Catégorie -->
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ equipement.categorie|default:"Non spécifiée" }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
        {{ equipement.agence.nom }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap">
        {% include 'core/atoms/status_badge.html' with statut=equipement.statut %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-3">
        <a href="#" class="text-renttech-primary hover:underline">Modifier</a>
    </td>
</tr>
