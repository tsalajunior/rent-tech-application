<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentTech - Connexion</title>
    {% load static %}
    <!-- Fichier CSS compilé par Tailwind -->
    <link rel="icon" href="{% static 'core/images/RentTech_Logo.jpg' %}" type="image/jpg">
    <link rel="stylesheet" href="{% static 'core/css/output.css' %}">
    <!-- CDN Tailwind CSS pour un test immédiat et garanti -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        renttech: {
                            dark: '#0f172a',
                            primary: '#2563eb',
                            lightblue: '#38bdf8',
                            offwhite: '#f8fafc',
                        }
                    }
                }
            }
        }
    </script>
</head>

<body
    class="bg-renttech-offwhite text-renttech-darktext font-sans antialiased min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full mx-4 mb-8">
        <!-- Logo / En-tête -->
        <div class="text-center mb-4">
            <img src="{% static 'core/images/RentTech_Logo.jpg' %}" alt="Logo RentTech" height="180"
                width="180" class="mx-auto mb-4 rounded-full">
            <p class="text-gray-600 mt-2 text-sm">Système de location de matériels informatiques et électroniques.</p>
        </div>

        <!-- Carte de Connexion -->
        <div class="bg-white shadow-lg rounded-xl p-8 border border-gray-100">
            <h2 class="text-xl font-bold text-renttech-dark mb-6">Connexion au comptoir</h2>

            <!-- Messages d'alerte / Erreurs -->
            {% if form.errors %}
            <div class="mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded">
                Nom d'utilisateur ou mot de passe incorrect. Veuillez réessayer.
            </div>
            {% endif %}

            <form method="POST" class="space-y-4">
                {% csrf_token %}

                <div>
                    <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Nom
                        d'utilisateur</label>
                    <input type="text" name="username" id="id_username" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-renttech-primary focus:outline-none">
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                    <input type="password" name="password" id="id_password" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-renttech-primary focus:outline-none">
                </div>

                <button type="submit"
                    class="w-full bg-renttech-primary hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition shadow">
                    Se connecter
                </button>
            </form>
        </div>

        <!-- Pied de page discret -->
        <div class="text-center mt-6 text-xs text-gray-500">
            &copy; 2026 RentTech | Tous droits réservés.
            Développé par <a href="https://www.linkedin.com/in/stephane-tsala" target="_blank"
                class="text-renttech-lightblue hover:text-renttech-primary transition">Stéphane Tsala</a>.
        </div>
    </div>
    <!-- Script de sécurité anti-historique de connexion -->
    <script>
        // Si l'URL contient ?next=, on nettoie l'historique pour éviter les boucles de redirection
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.pathname);
        }
    </script>
</body>

</html>
