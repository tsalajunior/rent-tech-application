<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RentTech - Plateforme de Location{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'core/images/RentTech_Logo.jpg' %}" type="image/jpg">
    <!-- Fichier CSS compilé par Tailwind -->
    <link rel="stylesheet" href="{% static 'core/css/output.css' %}">
</head>

<body class="bg-renttech-offwhite text-renttech-darktext font-sans antialiased min-h-screen flex flex-col">

    <!-- En-tête / Navigation -->
    <header class="bg-renttech-dark text-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="">
                <a href="{% url 'core:dashboard' %}">
                    <img src="{% static 'core/images/RentTech_Logo.jpg' %}" alt="Logo RentTech" height="50" width="50" class="rounded-full">
                </a>
            </div>
            <nav class="space-x-4">
                <a href="{% url 'core:dashboard' %}" class="hover:text-renttech-lightblue transition">Tableau de
                    bord</a>
                <a href="{% url 'core:liste_equipements' %}"
                    class="hover:text-renttech-lightblue transition">Équipements</a>
                <a href="{% url 'core:liste_clients' %}" class="hover:text-renttech-lightblue transition">Clients</a>
            </nav>
        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="flex-grow container mx-auto px-4 py-8">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Pied de page -->
    <footer class="bg-renttech-dark text-white py-4 text-center text-sm">
        <p>&copy; 2026 RentTech - Logiciel de Gestion d'Agence.</p>
    </footer>

</body>

</html>
