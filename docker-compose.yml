version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: renttech_db_container
    restart: always
    environment:
      POSTGRES_DB: renttech_db
      POSTGRES_USER: renttech_user
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5433:5432" # <-- On change le port externe en 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: renttech_web_container
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db # Nom du service conteneur pour Django à l'intérieur du réseau Docker
      - POSTGRES_PORT=5432 # Port interne de PostgreSQL dans le conteneur
    depends_on:
      - db

volumes:
  postgres_data:
