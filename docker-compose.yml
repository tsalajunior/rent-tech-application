version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: renttech_db_container
    restart: always
    environment:
      POSTGRES_DB: renttech_db
      POSTGRES_USER: renttech_user
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5433:5432"  # <-- On change le port externe en 5433
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: